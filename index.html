<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 10px; font-family: 'Inter', sans-serif; background: transparent; color: #1e293b; }
        
        .search-wrapper { margin-bottom: 20px; }
        #announcement-search {
            width: 100%; box-sizing: border-box; padding: 14px 20px; 
            border-radius: 50px; border: 1px solid #e2e8f0; 
            background: #fff; font-family: 'Inter', sans-serif; 
            font-size: 13px; outline: none; transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        #announcement-search:focus { border-color: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1); }

        .nav { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .btn { 
            padding: 8px 14px; border-radius: 20px; border: 1px solid #e2e8f0; 
            background: #fff; cursor: pointer; font-size: 11px; font-weight: 700; 
            text-transform: uppercase; color: #64748b; transition: 0.2s;
        }
        .btn.active { background: #000; color: #fff; border-color: #000; }
        
        .card { 
            padding: 20px; margin-bottom: 15px; border-radius: 12px; 
            border: 1px solid #f1f5f9; background: #f8fafc; position: relative; 
        }
        .tag { 
            font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 4px; 
            color: #fff; text-transform: uppercase; margin-bottom: 12px; display: inline-block; 
        }
        .tag-open { background: #ef4444; } 
        .tag-need { background: #22c55e; } 
        .tag-ref { background: #f59e0b; } 
        .tag-vendor { background: #6366f1; } 
        .tag-gen { background: #94a3b8; }
        
        .email-btn { 
            display: inline-block; padding: 10px 18px; background: #1e293b; 
            border-radius: 8px; color: #fff !important; font-size: 11px; 
            font-weight: 800; text-decoration: none; text-transform: uppercase; 
            border: none; cursor: pointer; transition: background 0.2s;
        }
        .email-btn:hover { background: #000; }
        
        .footer-nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 5px; border-top: 2px solid #f1f5f9; margin-top: 10px; 
        }
        .view-all { font-size: 11px; font-weight: 900; color: #000; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <div class="nav">
        <button class="btn active" onclick="filterData('All', event)">All</button>
        <button class="btn" onclick="filterData('Open House', event)">Open Houses</button>
        <button class="btn" onclick="filterData('Need', event)">Needs</button>
        <button class="btn" onclick="filterData('Referral', event)">Referrals</button>
        <button class="btn" onclick="filterData('Vendor', event)">Vendors</button>
    </div>

    <div class="search-wrapper">
        <input type="text" id="announcement-search" placeholder="Search the Pulse (name, property, details)..." onkeyup="searchPosts()">
    </div>
    
    <div id="board">Loading announcements...</div>

    <script>
        let masterData = [];
        const webAppUrl = 'https://script.google.com/macros/s/AKfycbz20eJ8aXdEwezcg1BLJrjksB3R8N2Zyccm1SQOfB6e-XLCcTQeUEgbLR5f5ST2ORLu/exec';

        async function load() {
            try {
                const res = await fetch(webAppUrl);
                masterData = await res.json();
                filterData('All');
            } catch (e) { document.getElementById('board').innerText = 'Sync Error'; }
        }

        function searchPosts() {
            let filter = document.getElementById('announcement-search').value.toLowerCase();
            const urlParams = new URLSearchParams(window.location.search);
            const isFullBoard = urlParams.get('view') === 'all';

            if (filter === "") {
                filterData(window.currentCategory || 'All');
                return;
            }

            let matches = masterData.filter(i => {
                let text = (i.head + i.body + i.name + i.type).toLowerCase();
                return text.includes(filter);
            });

            let displayMatches = isFullBoard ? matches : matches.slice(0, 3);
            renderItems(displayMatches, true);
        }

        function renderItems(items, isSearch = false) {
            const board = document.getElementById('board');
            if (items.length === 0 && isSearch) {
                board.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b; font-weight:700; font-size:12px;">NO MATCHES FOUND.</div>';
                return;
            }

            board.innerHTML = items.map(i => {
                const d = i.published ? new Date(i.published) : new Date();
                const cleanDate = isNaN(d) ? "Recently" : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' @ ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                
                let tClass = 'tag-gen';
                if(i.type.includes('Open')) tClass = 'tag-open';
                else if(i.type.includes('Need')) tClass = 'tag-need';
                else if(i.type.includes('Referral')) tClass = 'tag-ref';
                else if(i.type.includes('Vendor')) tClass = 'tag-vendor';

                const subject = encodeURIComponent(`Inquiry: ${i.head}`);

                return `
                    <div class="card">
                        <span style="float:right; font-size:10px; color:#94a3b8; font-weight:bold;">${cleanDate}</span>
                        <span class="tag ${tClass}">${i.type}</span>
                        <strong style="display:block; font-size:18px; color:#0f172a; margin-bottom:6px;">${i.head}</strong>
                        <p style="font-size:14px; color:#475569; margin:0 0 15px 0; line-height:1.5;">${i.body}</p>
                        <div style="border-top:1px solid #f1f5f9; padding-top:15px; display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-size:13px; font-weight:700;">— ${i.name}</span>
                            <button onclick="window.open('mailto:${i.email}?subject=${subject}', '_blank')" class="email-btn">Email Agent</button>
                        </div>
                    </div>`;
            }).join('');
        }

        function filterData(cat, e) {
            window.currentCategory = cat;
            if(e) {
                document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById('announcement-search').value = ''; 
            }
            
            let items = cat === 'All' ? masterData : masterData.filter(i => String(i.type).includes(cat));
            const urlParams = new URLSearchParams(window.location.search);
            const isFullBoard = urlParams.get('view') === 'all';
            
            const displayItems = isFullBoard ? items : items.slice(0, 3);
            renderItems(displayItems);

            if (!isFullBoard && items.length > 3) {
                document.getElementById('board').innerHTML += `
                    <div class="footer-nav">
                        <span style="font-size:11px; font-weight:900;">⬇ SCROLL PAGE TO SEE MORE</span>
                        <a href="https://portal.mykwsl.com/#announcements" target="_parent" class="view-all">VIEW FULL BOARD →</a>
                    </div>`;
            }
        }
        load();
    </script>
</body>
</html>
